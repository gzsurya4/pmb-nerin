        .split(',').map(norm).filter(Boolean)))

// Cari kelompok program studi yang paling cocok dengan teks jurusan/profesi
function suggest(text) {
  const q = norm(text);
  if (q.length < 3) return [];
  const qt = q.split(' ').filter(t => t.length >= 4);
  const out = [];
  for (const g of REF) {
    let best = 0, sum = 0;
    for (const kw of g.kw) {
      let s = 0;
      if ((' ' + q + ' ').indexOf(' ' + kw + ' ') >= 0) s = kw.length * 3 + 4;
      else if (kw.indexOf(q) === 0) s = q.length * 2.2;
      else if (q.length >= 4 && kw.indexOf(q) >= 0) s = q.length * 1.6;
      else { const kt = kw.split(' '); for (const t of qt) if (kt.indexOf(t) >= 0) s += t.length * 1.2; }
      if (s > best) best = s;
      sum += s;
    }
    const sc = best + (sum - best) * 0.15;
    if (sc >= 5) out.push({ g: g, sc: sc });
  }
  out.sort((a, b) => b.sc - a.sc);
  return out.slice(0, 3);
}

const sha256 = (function () {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,

    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  return function (msg) {
    const bytes = unescape(encodeURIComponent(String(msg)));
    const len = bytes.length;
    const n = (((len + 8) >> 6) + 1) * 16;
    const m = new Array(n).fill(0);
    for (let i = 0; i < len; i++) m[i >> 2] |= bytes.charCodeAt(i) << (24 - (i % 4) * 8);
    m[len >> 2] |= 0x80 << (24 - (len % 4) * 8);
    m[n - 1] = len * 8;
    let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Array(64);
    for (let o = 0; o < n; o += 16) {
      for (let t = 0; t < 16; t++) w[t] = m[o + t] | 0;
      for (let t = 16; t < 64; t++) {
        const a = w[t - 15], b = w[t - 2];
        const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
        const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
      }
      let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let t = 0; t < 64; t++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[t] + w[t]) | 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H = [(H[0] + a) | 0, (H[1] + b) | 0, (H[2] + c) | 0, (H[3] + d) | 0, (H[4] + e) | 0, (H[5] + f) | 0, (H[6] + g) | 0, (H[7] + h) | 0];
    }
    return H.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
  };
})();

function cleanImportRows(rows) {

  (rows || []).forEach((r, i) => {
    const nis = cleanTxt(r.nis, 30), nama = cleanTxt(r.nama, 100), kelas = cleanTxt(r.kelas, 20);
    const id = normUser(r.username || r.nis);
    if (!nis || !nama || !kelas) { skipped.push('Baris ' + (i + 1) + ': data belum lengkap'); return; }
    if (!id) { skipped.push('Baris ' + (i + 1) + ': username tidak valid (huruf kecil, angka, titik, strip, garis bawah)'); return; }
    if (seen[id]) { skipped.push('Baris ' + (i + 1) + ': username ganda (' + id + ')'); return; }
    seen[id] = true; out.push({ id: id, nis: nis, nama: nama, kelas: kelas });
  });
  return { rows: out, skipped: skipped };
}

let FB = null;
async function fbInit() {
  if (FB) return FB;
  if (!firebaseConfig || !firebaseConfig.apiKey || /ANDA$/.test(firebaseConfig.apiKey) || /^PROJECT_ID/.test(firebaseConfig.projectId)) {
    throw new Error('firebaseConfig belum diisi. Ganti nilai firebaseConfig di bagian atas kode dengan konfigurasi project Firebase Anda.');
  }
  const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/';
  const mods = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = mods[0].initializeApp(firebaseConfig);
  const auth = mods[1].getAuth(app);
  await mods[1].setPersistence(auth, mods[1].inMemoryPersistence); // tanpa penyimpanan di browser
  FB = { app: app, auth: auth, A: mods[1], F: mods[2], db: mods[2].getFirestore(app) };
  return FB;
}
function fbMsg(e) {
  const c = String((e && e.code) || '');
  if (!c) return (e && e.message) || 'Terjadi kesalahan.';
  if (/permission-denied/i.test(c)) return 'Akses ditolak oleh Security Rules Firestore. Pastikan Rules sudah dipasang dan akun berhak melakukan aksi ini.';
  if (/unavailable|network-request-failed|deadline-exceeded/i.test(c)) return 'Tidak dapat terhubung ke Firebase. Periksa koneksi internet Anda.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/i.test(c)) return 'Email atau password salah.';
  if (/too-many-requests/i.test(c)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if (/not-found/i.test(c)) return 'Database Firestore belum dibuat atau tidak ditemukan pada project ini.';
  if (/requires-recent-login/i.test(c)) return 'Silakan login ulang lalu coba lagi.';
  if (/weak-password/i.test(c)) return 'Password baru terlalu lemah (minimal 6 karakter).';
  if (/api-key|invalid-api-key/i.test(c)) return 'API key Firebase tidak valid. Periksa firebaseConfig.';
  return 'Terjadi kesalahan (' + c + ').';
}
const FAILS = {};
function throttle(id) {
  const f = FAILS[id]; if (!f || !f.until) return;
  if (Date.now() < f.until) throw new Error('Terlalu banyak percobaan salah. Coba lagi dalam 1 menit.');
  delete FAILS[id];
}
function failMark(id) {
  const f = FAILS[id] || { n: 0, until: 0 };
  f.n++; if (f.n >= 5) f.until = Date.now() + 60000;
  FAILS[id] = f;
}
function fsAnswer(d) {
  return { username: d.username, nis: d.nis, nama: d.nama, kelas: d.kelas, diskusi: d.diskusi, rencana: d.rencana, alasan: d.alasan, target: d.target, mapel: d.mapel || [], p1: d.p1, p2: d.p2, waktu: d.waktu };
}
async function fsPackages(f) {
  const snap = await f.F.getDocs(f.F.collection(f.db, 'packages'));
  const map = {}; snap.forEach(d => { map[d.id] = (d.data().mapel || []).slice(); });
  const saved = Object.keys(map).length > 0;
  return { list: KODE_PAKET.map(k => ({ kode: k, mapel: map[k] || clone(DEFAULT_PAKET.find(p => p.kode === k).mapel) })), saved: saved };
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px}
.card h2,.card h3{font-size:18px;margin-bottom:12px}
.card h3.small{font-size:15px}
.page-title{font-size:24px;margin:6px 0 14px}
.field{display:grid;gap:6px;margin-bottom:14px;position:relative}
.field:last-child{margin-bottom:0}
.field>label,.lbl{font-weight:600;font-size:13px}
.hint{color:var(--muted);font-size:12.5px}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea.input{resize:vertical;min-height:84px}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input[readonly]{background:var(--surface-2)}
.pw{position:relative}
.pw .input{padding-right:48px}
.pw button{position:absolute;right:4px;top:3px;width:40px;height:40px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.pw button:hover{color:var(--ink)}
.ro{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ro:last-child{border-bottom:0}
.ro span{color:var(--muted)}.ro b{overflow-wrap:anywhere}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer;padding:8px 12px}
.seg button[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand)}
.seg button.warn[aria-checked="true"]{border-color:var(--brick);background:var(--brick-soft);color:var(--brick);box-shadow:inset 0 0 0 1px var(--brick)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid;font-size:13.5px}
.alert svg{flex:none;margin-top:2px}
.alert.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.alert.info{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2)}
.alert b{display:block;margin-bottom:2px}
.alert .txt{min-width:0;color:var(--ink)}
.alert.ok b,.alert.warn b,.alert.bad b,.alert.info b{color:inherit}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;line-height:1.5}
.chip.hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
button.chip{cursor:pointer;min-height:32px}
button.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--warn-soft);color:var(--warn)}
.badge.kuliah{background:var(--brand-soft);color:var(--brand-2)}
.badge.kerja{background:var(--brick-soft);color:var(--brick)}

/* ---------- login ---------- */
.login{max-width:440px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.login-hero{text-align:center;padding:26px 14px 20px;border-radius:18px;border:1px solid var(--line);background-color:var(--surface);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='40'><path d='M0 .5H64M0 20.5H64M0 40.5H64M.5 0V20M32.5 20V40' stroke='rgba(201,90,10,0.17)' fill='none'/></svg>")}
.login-hero img{width:104px;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.login-hero h1{font-size:25px;font-weight:800;letter-spacing:.01em}
.login-hero p{margin-top:6px;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--brand-2)}
.reminder{display:flex;gap:10px;align-items:center;background:var(--brick-soft);border:1px solid var(--brick);color:var(--brick);border-radius:12px;padding:11px 14px;font-weight:700;font-size:13.5px;margin-bottom:16px}
.powered{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.ribbon{position:fixed;left:0;right:0;top:0;text-align:center;background:var(--star);color:#3a3000;font-size:12px;font-weight:800;letter-spacing:.06em;padding:3px 8px;z-index:30}
.preview-box{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 12px;margin-top:14px}
.preview-box code{font-family:ui-monospace,Consolas,monospace;color:var(--ink)}

/* ---------- kerangka aplikasi ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topbar img{width:42px;height:42px;object-fit:contain}
.topbar .ttl{flex:1 1 200px;min-width:0}
.topbar .ttl b{display:block;font-family:var(--font-d);font-size:16px;font-weight:800;line-height:1.2}
.topbar .ttl span{font-size:12px;color:var(--muted)}
.topbar .who{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who .nm{font-weight:600;font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mcard{display:grid;grid-template-columns:48px 1fr;gap:4px 14px;align-items:center;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:var(--ink)}
.mcard:hover{border-color:var(--brand)}
.mcard .ic{grid-row:span 2;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-2)}
.mcard.brick .ic{background:var(--brick-soft);color:var(--brick)}
.mcard b{font-family:var(--font-d);font-size:16px}
.mcard small{color:var(--muted);font-size:12.5px}

/* ---------- formulir ---------- */
.rel{position:relative}
.pop{position:absolute;z-index:20;left:0;right:0;top:calc(100% - 2px);background:var(--surface);border:1.5px solid var(--brand);border-radius:14px;box-shadow:0 14px 40px rgba(8,20,32,.28);padding:12px;max-height:min(70vh,420px);overflow:auto}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pop-h b{font-size:13px;color:var(--brand-2)}
.pop-x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.sg{padding:10px 0;border-top:1px dashed var(--line)}
.sg:first-of-type{border-top:0}
.sg h4{font-size:14.5px}
.sg .rum{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sg .src{font-size:12.5px;margin:4px 0 8px}
.sg .go{margin-top:8px}
.sugline{font-size:12.5px;color:var(--brand-2);background:var(--brand-soft);border-radius:8px;padding:6px 10px}
.ck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);min-height:46px}
.ck:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.ck input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.ck span{flex:1;min-width:0}
.tag{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--star);color:#3a3000;border-radius:6px;padding:1px 6px;flex:none}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pk{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface);position:relative}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.pk:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.pk.off{opacity:.45;cursor:not-allowed}
.pk .pk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pk .pk-h b{font-family:var(--font-d);font-size:17px}
.pk .match{font-size:12px;color:var(--ok);font-weight:700}
.pk .note{font-size:12px;color:var(--muted);margin-top:8px}
.actions{position:sticky;bottom:0;padding:12px 0 12px;background:linear-gradient(to top,var(--bg) 62%,transparent);z-index:5}
.done{text-align:center;padding:30px 18px}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.done h2{font-size:22px;margin-bottom:8px}

/* ---------- admin ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-d);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wide{min-width:200px;max-width:320px;overflow-wrap:anywhere}
td.nw{white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.b2 i{background:var(--brick)}
.row{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:8px 0}
.row b{font-family:var(--font-d)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
details>summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:44px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-weight:700;color:var(--muted)}
details[open]>summary::after{content:"\\2212"}
details .in{padding:0 12px 12px}
.list{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.list li:last-child{border-bottom:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.pk-edit{display:grid;gap:8px}
.pk-edit .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}

/* ---------- modal, toast, banner ---------- */
.ov{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:60;overflow:auto}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:20px;max-height:92vh;overflow:auto}

let modalEl = null, modalPrevFocus = null;
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; if (modalPrevFocus && modalPrevFocus.focus) modalPrevFocus.focus(); } }
function openModal(o) {
  closeModal();

  ov.innerHTML = '<div class="dlg ' + (o.wide ? 'wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '"><h3>' + esc(o.title) + '</h3><div class="mb">' + o.body + '</div><div class="acts"></div></div>';
  const acts = $('.acts', ov);
  (o.actions || []).forEach(a => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.addEventListener('click', () => { const r = a.onClick ? a.onClick(b, ov) : null; if (a.close !== false && !(r && r.keep)) closeModal(); });
    acts.appendChild(b);
  });
  ov.addEventListener('mousedown', e => { if (e.target === ov && !o.sticky) closeModal(); });

function confirmBox(o) {

  });
}

        "self.addEventListener('install',function(e){self.skipWaiting();});",
        "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});",
        "self.addEventListener('fetch',function(e){var r=e.request;",

      navigator.serviceWorker.register(url).catch(() => { });
    }
  } catch (e) { }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; showInstallBanner(false); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; const b = $('#install'); if (b) b.hidden = true; toast('Aplikasi berhasil dipasang.', 'ok'); });

}

  $('#lbtn').addEventListener('click', doLogin);

    const i = $('#lp'), show = i.type === 'password';
    i.type = show ? 'text' : 'password';

async function doLogin(ev) {
  if (ev && ev.preventDefault) ev.preventDefault();
  const b = $('#lbtn'); if (!b || b.disabled) return;
  const u = $('#lu').value.trim(), p = $('#lp').value, err = $('#lerr');
  err.hidden = true;
  if (!u || !p) { err.textContent = 'Isi username dan password terlebih dahulu.'; err.hidden = false; return; }
  btnBusy(b, true, 'Memeriksa...');
  const r = await api('apiLogin', u, p);
  if (!r.ok) { btnBusy(b, false); err.textContent = r.msg || 'Login gagal.'; err.hidden = false; $('#lp').select(); return; }
  startSession(r);
}
async function startSession(r) {
  S.role = r.role; S.user = r.user; S.defaultPw = !!r.defaultPw;
  S.view = 'home'; S.tab = 'ringkasan';
  app('<div class="login"><div class="skel"></div><div class="skel"></div></div>');
  if (S.role === 'admin') { if (await adminReload()) renderAdmin(); }

}

}
function sessionLost(r) {
  if (r && !r.ok && /sesi berakhir/i.test(r.msg || '')) { toast('Sesi berakhir, silakan login kembali.', 'warn'); renderLogin(); return true; }
  return false;
}

function openChangePw() {
  openModal({

      '<div class="alert bad" id="cperr" hidden></div>',
    actions: [
      { label: 'Batal', cls: 'ghost' },
      {
        label: 'Simpan', cls: 'primary', close: false, onClick: async b => {
          const o = $('#cp0').value, n = $('#cp1').value, n2 = $('#cp2').value, er = $('#cperr');
          er.hidden = true;

    '<section class="card" id="sec-diskusi"><h3>Apakah sudah diskusi dengan orangtua?</h3>' +
    '<div class="seg" role="radiogroup" aria-label="Sudah diskusi dengan orangtua">' +
    '<button type="button" role="radio" data-act="diskusi" data-v="Ya" aria-checked="false">YA, SUDAH</button>' +
    '<button type="button" role="radio" class="warn" data-act="diskusi" data-v="Belum" aria-checked="false">BELUM</button></div>' +
    '<div id="diskusi-note" style="margin-top:12px"></div></section>' +
    '<div class="stack" id="f-dyn"></div></div>'));
  if (F && F.diskusi) setDiskusi(F.diskusi, true);
}

let restoring = false;
function setDiskusi(v, restore) {
  restoring = !!restore;
  F.diskusi = v;
  $$('[data-act="diskusi"]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === v)));
  $('#diskusi-note').innerHTML = v === 'Belum'
    ? alertBox('warn', 'Segera diskusi dengan orangtua', 'Formulir belum bisa dilanjutkan. Bicarakan dulu rencana masa depan dan pilihan mapel Anda dengan orangtua/wali di rumah, lalu kembali dan pilih "YA, SUDAH".')
    : '';
  if (v === 'Belum' && !restoring) toast('Segera diskusi dengan orangtua sebelum mengisi.', 'warn');
  renderDyn();
}

function renderDyn() {
  const el = $('#f-dyn'); if (!el) return;
  if (F.diskusi !== 'Ya') { el.innerHTML = ''; return; }
  let h = '<section class="card" id="sec-rencana"><h3>Rencana masa depan</h3>' +
    '<div class="seg" role="radiogroup" aria-label="Rencana masa depan">' +
    '<button type="button" role="radio" data-act="rencana" data-v="Kuliah" aria-checked="' + (F.rencana === 'Kuliah') + '">KULIAH</button>' +
    '<button type="button" role="radio" data-act="rencana" data-v="Kerja" aria-checked="' + (F.rencana === 'Kerja') + '">KERJA</button></div></section>';
  if (F.rencana) {
    const k = F.rencana === 'Kuliah';
    h += '<section class="card" id="sec-isian"><h3>' + (k ? 'Rencana kuliah' : 'Rencana kerja') + '</h3>' +
      '<div class="field"><label for="f-alasan">' + (k ? 'Alasan kuliah' : 'Alasan kerja') + '</label>' +
      '<textarea class="input" id="f-alasan" maxlength="500" placeholder="' + (k ? 'Tulis alasan Anda ingin kuliah' : 'Tulis alasan Anda ingin langsung bekerja') + '"></textarea></div>' +
      '<div class="field rel"><label for="f-target">' + (k ? 'Jurusan yang diminati' : 'Profesi pekerjaan yang diinginkan') + '</label>' +
      '<input class="input" id="f-target" maxlength="120" autocomplete="off" placeholder="' + (k ? 'Contoh: Kedokteran, Teknik Informatika, Akuntansi' : 'Contoh: Perawat, Programmer, Wirausaha') + '">' +
      '<div class="sugline" id="sugline" hidden></div><div class="pop" id="pop" hidden></div></div></section>' +
      '<section class="card" id="sec-mapel"><h3>Mapel pendukung/peminatan wajib</h3>' +
      '<p class="hint" style="margin-bottom:10px">Centang mapel yang Anda pilih. Rekomendasi berasal dari jurusan/profesi yang Anda tulis dan hanya berupa saran.</p>' +

      '<section class="card" id="sec-paket"><h3>Pilih paket mata pelajaran</h3>' +

}

function topSug() { return suggest(F.target); }
function suggestedSet() { const s = topSug(); return s.length ? s[0].g.mapel : []; }

function renderSug() {
  const line = $('#sugline'); if (!line) return;
  const s = topSug();
  if (!s.length) { line.hidden = true; } else {
    const g = s[0].g;
    line.hidden = false;
    line.textContent = g.mapel.length ? 'Saran mapel: ' + g.mapel.join(', ') + ' (kelompok ' + g.nama + ')' : 'Saran: ' + g.teks + ' (kelompok ' + g.nama + ')';
  }
  renderPop();
}

function renderPop() {
  const pop = $('#pop'); if (!pop) return;
  const s = topSug();
  if (!popOpen || popDismissed || !s.length) { pop.hidden = true; return; }
  pop.hidden = false;
  pop.innerHTML = '<div class="pop-h"><b>Rekomendasi mapel pendukung</b><button type="button" class="pop-x" data-act="pop-x" aria-label="Tutup rekomendasi">&times;</button></div>' +
    s.map((x, i) => {
      const g = x.g;
      return '<div class="sg"><span class="rum">' + esc(g.rumpun) + '</span><h4>' + esc(g.nama) + '</h4>' +
        '<div class="src">Mapel pendukung: <b>' + esc(g.teks) + '</b></div>' +
        (g.mapel.length ? '<div class="chips">' + g.mapel.map(m => '<button type="button" class="chip" data-act="chip" data-m="' + esc(m) + '" aria-pressed="' + (F.mapel.indexOf(m) >= 0) + '">' + esc(m) + '</button>').join('') + '</div>' +
          '<div class="go"><button type="button" class="btn sm" data-act="chip-all" data-i="' + i + '">Centang semua saran ini</button></div>' : '') +
        '</div>';
    }).join('') +
    '<div class="hint" style="margin-top:8px">Sumber: ' + esc(APP.sumber) + '. Saran saja, pilihan akhir tetap di tangan Anda.</div>';
}

function renderMapel() {
  const g = $('#ck-grid'); if (!g) return;
  const sg = suggestedSet();
  g.innerHTML = MAPEL_LIST.map(m => '<label class="ck"><input type="checkbox" data-mp="' + esc(m) + '"' + (F.mapel.indexOf(m) >= 0 ? ' checked' : '') + '><span>' + esc(m) + '</span>' +
    (sg.indexOf(m) >= 0 ? '<em class="tag">disarankan</em>' : '') + '</label>').join('');
}

function renderPaket() {
  const w = $('#pk-wrap'); if (!w) return;
  const pk = S.student.packages || [];
  const mine = F.mapel.map(norm);
  const card = (n, p) => {
    const sel = F[n] === p.kode, other = n === 'p2' ? F.p1 : F.p2;
    const off = n === 'p2' && F.p1 === p.kode;
    const hit = p.mapel.filter(m => mine.indexOf(norm(m)) >= 0).length;
    return '<label class="pk' + (off ? ' off' : '') + '"><input type="radio" name="' + n + '" value="' + esc(p.kode) + '"' + (sel ? ' checked' : '') + (off ? ' disabled' : '') + '>' +
      '<div class="pk-h"><b>Paket ' + esc(p.kode) + '</b>' + (F.mapel.length ? '<span class="match">' + hit + '/' + p.mapel.length + ' cocok</span>' : '') + '</div>' +
      '<div class="chips">' + p.mapel.map(m => '<span class="chip' + (mine.indexOf(norm(m)) >= 0 ? ' hit' : '') + '">' + esc(m) + '</span>').join('') + '</div>' +
      (off ? '<div class="note">Sudah dipilih sebagai Pilihan 1</div>' : '') + '</label>';
  };
  w.innerHTML = ['p1', 'p2'].map((n, i) => '<div><div class="lbl" style="margin-bottom:8px">Paket Pilihan ' + (i + 1) + (i === 0 ? ' (utama)' : '') + '</div><div class="pk-grid">' + pk.map(p => card(n, p)).join('') + '</div></div>').join('');
}

function toggleMapel(m, on) {
  const i = F.mapel.indexOf(m);
  if (on && i < 0) F.mapel.push(m);
  if (!on && i >= 0) F.mapel.splice(i, 1);
  renderMapel(); renderPaket(); renderPop();
}

// ---------- input formulir ----------
R.addEventListener('input', e => {
  if (!F) return;
  if (e.target.id === 'f-alasan') F.alasan = e.target.value;
  else if (e.target.id === 'f-target') { F.target = e.target.value; popDismissed = false; popOpen = true; renderSug(); renderMapel(); }
});
R.addEventListener('change', e => {
  if (!F) return;
  const t = e.target;
  if (t.dataset && t.dataset.mp !== undefined) toggleMapel(t.dataset.mp, t.checked);
  else if (t.name === 'p1' || t.name === 'p2') {
    F[t.name] = t.value;
    if (t.name === 'p1' && F.p2 === t.value) { F.p2 = ''; toast('Pilihan 2 direset karena sama dengan Pilihan 1.', 'warn'); }
    renderPaket();
  }
});
R.addEventListener('focusin', e => {
  if (F && e.target.id === 'f-target') { popOpen = true; popDismissed = false; renderPop(); }
});
R.addEventListener('focusout', e => {
  if (F && e.target.id === 'f-target') setTimeout(() => { if (R.activeElement && R.activeElement.id === 'f-target') return; popOpen = false; renderPop(); }, 160);
});
// jaga fokus input saat mengetuk panel rekomendasi
R.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#pop')) e.preventDefault(); });

// ---------- validasi & kirim ----------
function validateForm() {
  const errs = [];
  if (F.diskusi !== 'Ya') errs.push(['sec-diskusi', 'Pilih "YA, SUDAH" setelah berdiskusi dengan orangtua.']);
  if (!F.rencana) errs.push(['sec-rencana', 'Pilih rencana masa depan: Kuliah atau Kerja.']);
  if (F.rencana) {
    if (F.alasan.trim().length < 5) errs.push(['f-alasan', 'Tulis alasan ' + (F.rencana === 'Kuliah' ? 'kuliah' : 'kerja') + ' minimal 5 huruf.']);
    if (F.target.trim().length < 2) errs.push(['f-target', 'Tulis ' + (F.rencana === 'Kuliah' ? 'jurusan yang diminati.' : 'profesi yang diinginkan.')]);
    if (!F.mapel.length) errs.push(['sec-mapel', 'Centang minimal 1 mapel pendukung.']);
    if (!F.p1) errs.push(['sec-paket', 'Pilih Paket Pilihan 1.']);
    else if (!F.p2) errs.push(['sec-paket', 'Pilih Paket Pilihan 2.']);
    else if (F.p1 === F.p2) errs.push(['sec-paket', 'Paket Pilihan 1 dan 2 tidak boleh sama.']);
  }
  return errs;
}

function reviewForm() {
  const errs = validateForm();
  if (errs.length) {
    toast(errs[0][1], 'bad');
    const el = R.getElementById(errs[0][0]);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (el.focus && /INPUT|TEXTAREA/.test(el.tagName)) el.focus(); }
    return;
  }
  const a = { diskusi: F.diskusi, rencana: F.rencana, alasan: F.alasan.trim(), target: F.target.trim(), mapel: F.mapel.slice(), p1: F.p1, p2: F.p2 };
  openModal({
    title: 'Periksa kembali isian Anda', wide: true, sticky: true,
    body: alertBox('warn', 'Data tidak bisa diubah setelah dikirim', 'Pastikan semua sudah benar dan sudah dibicarakan dengan orangtua.') +
      '<div style="margin-top:10px">' + answerSummary(a, S.student.packages) + '</div>',
    actions: [
      { label: 'Periksa lagi', cls: 'ghost' },
      {
        label: 'Ya, kirim sekarang', cls: 'primary', close: false, onClick: async b => {
          btnBusy(b, true, 'Mengirim...');
          const r = await api('apiSubmitForm', null, a);
          btnBusy(b, false);
          if (sessionLost(r)) { closeModal(); return; }
          if (!r.ok) { closeModal(); toast(r.msg || 'Gagal mengirim data.', 'bad'); if (await studentReload() && S.student.submitted) { F = null; renderStudentHome(); } return; }
          closeModal();
          S.student.submitted = true; S.student.answer = r.answer || Object.assign({ waktu: nowStr() }, a);
          F = null; renderDone();
        }
      }
    ]
  });
}

function renderDone() {
  S.view = 'home';
  app(shell('<section class="card done"><div class="tick">' + IC.check + '</div>' +
    '<h2>Selamat, data Anda sudah terkirim</h2>' +
    '<p>Selamat data anda sudah terkirim &amp; anda sudah tidak bisa lagi memilih mapel pendukung/peminatan.</p>' +
    '<div style="margin-top:18px"><button class="btn primary" data-act="home" type="button">Kembali ke beranda</button></div></section>'));
}

const TABS = [['ringkasan', 'Ringkasan', 'Ringkasan', 'list'], ['kelas', 'Per Kelas', 'Kelas', 'users'], ['paket', 'Per Paket A-E', 'Paket', 'box'], ['pilihan', 'Pilihan 1 / 2', 'Pilihan', 'chart'], ['editpaket', 'Edit Paket Mapel', 'Edit Paket', 'cog'], ['siswa', 'Data Siswa', 'Siswa', 'userplus']];

async function adminReload() {

function joined() {
  const m = ansMap();

}
function fillRingkasan() {
  const q = norm(AF.q);

    if (AF.kelas && r.kelas !== AF.kelas) return false;

    if (AF.rencana && (!r.a || r.a.rencana !== AF.rencana)) return false;
    if (q && norm([r.nama, r.nis, r.kelas, r.a ? r.a.target : '', r.a ? r.a.alasan : ''].join(' ')).indexOf(q) < 0) return false;
    return true;
  }).sort((x, y) => x.kelas.localeCompare(y.kelas, 'id', { numeric: true }) || x.nama.localeCompare(y.nama, 'id'));
  $('#rcount').textContent = rows.length + ' dari ' + S.admin.students.length + ' siswa';
  $('#rbody').innerHTML = rows.length ? rows.map((r, i) => {
    const a = r.a;
    return '<tr><td class="num">' + (i + 1) + '</td><td class="nw"><b>' + esc(r.nama) + '</b></td><td class="nw">' + esc(r.kelas) + '</td><td class="nw">' + esc(r.nis) + '</td>' +

      '<td class="wide">' + (a ? esc((a.mapel || []).join(', ')) : '-') + '</td>' +

    const lst = l => l.length ? '<ul class="list">' + l.sort((x, y) => x.kelas.localeCompare(y.kelas, 'id', { numeric: true }) || x.nama.localeCompare(y.nama, 'id')).map(a => '<li><span>' + esc(a.nama) + '</span><span class="hint">' + esc(a.kelas) + '</span></li>').join('') + '</ul>' : '<p class="hint">Belum ada.</p>';
    return '<section class="card"><div class="toolbar" style="margin-bottom:8px"><h3 style="margin:0">Paket ' + c + '</h3><span class="sp"></span><span class="badge kuliah">' + (l1.length + l2.length) + ' pemilih</span></div>' +
      '<div class="chips">' + p.mapel.map(m => '<span class="chip">' + esc(m) + '</span>').join('') + '</div>' +
      '<p class="hint" style="margin-top:10px">Pilihan 1: <b>' + l1.length + '</b> &middot; Pilihan 2: <b>' + l2.length + '</b></p>' +
      '<details><summary>Siswa Pilihan 1 <span class="badge ok">' + l1.length + '</span></summary><div class="in">' + lst(l1) + '</div></details>' +
      '<details><summary>Siswa Pilihan 2 <span class="badge ok">' + l2.length + '</span></summary><div class="in">' + lst(l2) + '</div></details></section>';
  }).join('') + '</div>';
}

// ---------- 4. pilihan 1 / 2 ----------
function tabPilihan() {
  const n = AF.pilihan, key = n === 1 ? 'p1' : 'p2', an = S.admin.answers, tot = an.length;
  const max = Math.max(1, ...['A', 'B', 'C', 'D', 'E'].map(c => an.filter(a => a[key] === c).length));
  return '<section class="card"><div class="toolbar"><h3 style="margin:0">Laporan per pilihan paket</h3><span class="sp"></span>' +
    '<div class="seg" style="grid-template-columns:auto auto;gap:6px" role="radiogroup" aria-label="Pilih laporan">' +
    '<button type="button" role="radio" data-act="pilihan" data-v="1" aria-checked="' + (n === 1) + '" style="min-height:40px;padding:0 18px">Pilihan 1</button>' +
    '<button type="button" role="radio" data-act="pilihan" data-v="2" aria-checked="' + (n === 2) + '" style="min-height:40px;padding:0 18px">Pilihan 2</button></div></div>' +
    ['A', 'B', 'C', 'D', 'E'].map(c => {
      const l = an.filter(a => a[key] === c).sort((x, y) => x.kelas.localeCompare(y.kelas, 'id', { numeric: true }) || x.nama.localeCompare(y.nama, 'id'));
      return '<div class="row"><b>Paket ' + c + '</b><div class="bar ' + (n === 2 ? 'b2' : '') + '"><i style="width:' + Math.round(l.length / max * 100) + '%"></i></div><span class="num" style="text-align:right;font-variant-numeric:tabular-nums"><b>' + l.length + '</b> <span class="hint">(' + (tot ? Math.round(l.length / tot * 100) : 0) + '%)</span></span></div>' +
        '<details><summary>Paket ' + c + ' &middot; ' + esc(pkText(c)) + '</summary><div class="in">' +
        (l.length ? '<ul class="list">' + l.map(a => '<li><span>' + esc(a.nama) + '</span><span class="hint">' + esc(a.kelas) + ' &middot; ' + esc(a.rencana) + '</span></li>').join('') + '</ul>' : '<p class="hint">Belum ada siswa.</p>') + '</div></details>';
    }).join('') + '</section>';
}

// ---------- 5. edit paket ----------
function tabEditPaket() {
  return '<section class="card"><h2>Edit paket mata pelajaran</h2>' +
    (S.admin.packagesSaved ? '' : alertBox('warn', 'Paket belum tersimpan di database', 'Yang tampil sekarang adalah susunan bawaan A-E. Tekan "Simpan perubahan paket" sekali agar tersimpan di Firestore.') + '<div style="height:10px"></div>') +
    alertBox('info', 'Catatan', 'Perubahan langsung tampil di formulir siswa berikutnya. Isian siswa yang sudah masuk tetap tercatat berdasarkan kode paket (A-E). Kosongkan kolom yang tidak dipakai.') +
    '<datalist id="dl-mapel">' + MAPEL_LIST.map(m => '<option value="' + esc(m) + '">').join('') + '</datalist>' +
    '<div class="stack" style="margin-top:14px">' + ['A', 'B', 'C', 'D', 'E'].map(c => {
      const p = pkOf(c) || { mapel: [] };
      return '<div class="pk-edit"><b style="font-family:var(--font-d);font-size:16px">Paket ' + c + '</b><div class="g">' +
        [0, 1, 2, 3, 4].map(i => '<input class="input" list="dl-mapel" data-pk="' + c + '" data-i="' + i + '" value="' + esc(p.mapel[i] || '') + '" placeholder="Mapel ' + (i + 1) + '" aria-label="Paket ' + c + ' mapel ' + (i + 1) + '" maxlength="60">').join('') + '</div></div>';
    }).join('') + '</div>' +
    '<div class="actions"><button class="btn primary lg" type="button" data-act="save-pk">Simpan perubahan paket</button></div></section>';
}
async function savePaket(btn) {
  const out = ['A', 'B', 'C', 'D', 'E'].map(c => ({ kode: c, mapel: $$('[data-pk="' + c + '"]').map(i => i.value.trim()).filter(Boolean) }));
  const bad = out.find(p => !p.mapel.length);
  if (bad) { toast('Paket ' + bad.kode + ' harus punya minimal 1 mapel.', 'bad'); return; }
  btnBusy(btn, true, 'Menyimpan...');
  const r = await api('apiAdminSavePackages', null, out);
  btnBusy(btn, false);
  if (sessionLost(r)) return;
  if (!r.ok) { toast(r.msg || 'Gagal menyimpan paket.', 'bad'); return; }
  S.admin.packages = out; S.admin.packagesSaved = true; toast('Paket mapel berhasil disimpan.', 'ok'); renderTab();
}

// ---------- 6. data siswa ----------
function tabSiswa() {
  return '<div class="stack"><section class="card"><h2>Import data siswa</h2>' +
    '<p class="hint" style="margin-bottom:10px">Salin dari Excel/Google Sheets lalu tempel di bawah. Urutan kolom: <b>NIS, Nama Lengkap, Kelas, Username (opsional, kosong = NIS)</b>. Baris judul dikenali otomatis. Password awal siswa baru: <b>siswa2026</b>. Siswa yang sudah ada diperbarui datanya tanpa mengubah password.</p>' +
    '<div class="field"><textarea class="input" id="imp" rows="6" placeholder="2526101&#9;Ahmad Fauzi&#9;X-1&#10;2526102&#9;Bunga Citra&#9;X-1" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px"></textarea></div>' +
    '<div class="toolbar"><label class="btn sm" for="imp-file" style="cursor:pointer">Pilih file CSV</label><input type="file" id="imp-file" accept=".csv,.txt,text/csv,text/plain" class="sr"><span class="sp"></span><button class="btn primary" type="button" data-act="import">Import data</button></div>' +
    '<div id="imp-res"></div></section>' +
    '<section class="card"><h2>Tambah satu siswa</h2><div class="filters">' +
    '<input class="input" id="ns-nis" placeholder="NIS" aria-label="NIS"><input class="input" id="ns-nama" placeholder="Nama lengkap" aria-label="Nama lengkap"><input class="input" id="ns-kelas" placeholder="Kelas (mis. X-1)" aria-label="Kelas"><input class="input" id="ns-user" placeholder="Username (opsional)" aria-label="Username">' +
    '</div><button class="btn primary" type="button" data-act="add-one">Tambah siswa</button></section>' +
    '<section class="card"><h2>Daftar siswa</h2><div class="filters"><input class="input" id="sq" type="search" placeholder="Cari nama / NIS / username" value="' + esc(AF.sq) + '" aria-label="Cari siswa"></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Username</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="sbody"></tbody></table></div></section></div>';
}
function fillSiswa() {
  const q = norm(AF.sq);
  const rows = S.admin.students.filter(s => !q || norm([s.username, s.nis, s.nama, s.kelas].join(' ')).indexOf(q) >= 0)
    .sort((x, y) => x.kelas.localeCompare(y.kelas, 'id', { numeric: true }) || x.nama.localeCompare(y.nama, 'id')).slice(0, 300);
  $('#sbody').innerHTML = rows.length ? rows.map(s => '<tr><td class="nw">' + esc(s.username) + '</td><td class="nw">' + esc(s.nis) + '</td><td><b>' + esc(s.nama) + '</b></td><td class="nw">' + esc(s.kelas) + '</td>' +
    '<td>' + (s.status === 'Sudah' ? '<span class="badge ok">Sudah</span>' : '<span class="badge no">Belum</span>') + '</td>' +
    '<td class="nw"><button class="btn sm" type="button" data-act="reset-pw" data-u="' + esc(s.username) + '">Reset password</button> <button class="btn sm danger" type="button" data-act="del-stu" data-u="' + esc(s.username) + '">Hapus</button></td></tr>').join('')
    : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:22px">Belum ada data siswa.</td></tr>';
}
function parseImport(txt) {
  const lines = String(txt).replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach((l, i) => {
    const sep = l.indexOf('\t') >= 0 ? '\t' : (l.indexOf(';') >= 0 ? ';' : ',');
    const c = l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    if (i === 0 && /nis|nama/i.test(c.join(' ')) && !/^\d+$/.test(c[0])) return;
    rows.push({ nis: c[0] || '', nama: c[1] || '', kelas: c[2] || '', username: c[3] || '' });
  });
  return rows;
}
function showImpResult(r) {
  const el = $('#imp-res'); if (!el) return;
  el.innerHTML = '<div style="margin-top:12px">' + alertBox('ok', 'Import selesai', r.added + ' siswa ditambahkan, ' + r.updated + ' diperbarui' + (r.skipped && r.skipped.length ? ', ' + r.skipped.length + ' dilewati.' : '.')) +
    (r.skipped && r.skipped.length ? '<ul class="hint" style="margin:8px 0 0 18px;padding:0">' + r.skipped.slice(0, 15).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div>';
}
async function doImport(rows, btn) {
  if (!rows.length) { toast('Tidak ada baris data untuk diimport.', 'bad'); return null; }
  if (rows.length > 1500) { toast('Maksimal 1500 baris per import.', 'bad'); return null; }
  btnBusy(btn, true, 'Mengimport...');
  const r = await api('apiAdminImportStudents', null, rows);
  btnBusy(btn, false);
  if (sessionLost(r)) return null;
  if (!r.ok) { toast(r.msg || 'Import gagal.', 'bad'); return null; }
  await adminReload(); return r;
}

// ---------- ekspor CSV ----------
function buildCsv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['No', 'Nama', 'Kelas', 'NIS', 'Status', 'Diskusi Ortu', 'Rencana', 'Alasan', 'Jurusan/Profesi', 'Mapel Pendukung', 'Pilihan 1', 'Pilihan 2', 'Waktu Kirim'];
  const rows = joined().sort((x, y) => x.kelas.localeCompare(y.kelas, 'id', { numeric: true }) || x.nama.localeCompare(y.nama, 'id')).map((r, i) => {
    const a = r.a;
    return [i + 1, r.nama, r.kelas, r.nis, a ? 'Sudah' : 'Belum', a ? 'Ya' : '', a ? a.rencana : '', a ? a.alasan : '', a ? a.target : '', a ? (a.mapel || []).join('; ') : '', a ? 'Paket ' + a.p1 : '', a ? 'Paket ' + a.p2 : '', a ? a.waktu : ''].map(q).join(',');
  });
  return [head.map(q).join(',')].concat(rows).join('\n');
}
function openExport() {
  const csv = buildCsv();
  openModal({
    title: 'Ekspor CSV', wide: true,
    body: '<p class="hint" style="margin-bottom:8px">Salin teks di bawah lalu tempel ke Google Sheets/Excel, atau unduh sebagai file.</p><textarea class="input" id="csv-t" rows="10" readonly>' + esc(csv) + '</textarea>',
    actions: [
      { label: 'Tutup', cls: 'ghost' },
      {
        label: 'Unduh file', onClick: () => {
          try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); a.download = 'rekap-mapel-pendukung.csv'; document.body.appendChild(a); a.click(); a.remove(); }
          catch (e) { toast('Unduh tidak didukung di sini, gunakan tombol Salin.', 'warn'); }
          return { keep: true };
        }
      },
      {
        label: 'Salin', cls: 'primary', close: false, onClick: () => {
          const t = $('#csv-t'); t.select();
          const ok = () => toast('CSV disalin ke clipboard.', 'ok');
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(csv).then(ok, () => { try { document.execCommand('copy'); ok(); } catch (e) { } });
          else { try { document.execCommand('copy'); ok(); } catch (e) { } }
        }
      }
    ]
  });
}

// ---------- input admin ----------
R.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'rq') { AF.q = e.target.value; fillRingkasan(); }
  else if (id === 'sq') { AF.sq = e.target.value; fillSiswa(); }
});
R.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'rk') { AF.kelas = e.target.value; fillRingkasan(); }
  else if (id === 'rs') { AF.status = e.target.value; fillRingkasan(); }
  else if (id === 'rr') { AF.rencana = e.target.value; fillRingkasan(); }
  else if (id === 'imp-file' && e.target.files && e.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { $('#imp').value = String(fr.result || ''); toast('File dibaca, tekan "Import data".', 'ok'); };
    fr.readAsText(e.target.files[0]);
  }
});

async function adminAction(a, t) {
  if (a === 'nav') { S.tab = t.dataset.v; renderAdmin(); }
  else if (a === 'pilihan') { AF.pilihan = +t.dataset.v; renderTab(); }
  else if (a === 'reload') { btnBusy(t, true, 'Memuat...'); await adminReload(); renderTab(); toast('Data dimuat ulang.', 'ok'); }
  else if (a === 'export') openExport();
  else if (a === 'save-pk') savePaket(t);
  else if (a === 'del-ans') {
    const u = t.dataset.u, s = S.admin.students.find(x => x.username === u);
    if (!await confirmBox({ title: 'Hapus isian siswa?', msg: 'Isian formulir milik <b>' + esc(s ? s.nama : u) + '</b> akan dihapus dan siswa dapat mengisi ulang. Tindakan ini tidak bisa dibatalkan.', ok: 'Ya, hapus isian', danger: true })) return;
    const r = await api('apiAdminDeleteAnswer', null, u);
    if (sessionLost(r)) return;
    if (!r.ok) { toast(r.msg || 'Gagal menghapus.', 'bad'); return; }
    await adminReload(); renderAdmin(); toast('Isian dihapus. Siswa dapat mengisi ulang.', 'ok');
  }
  else if (a === 'import') {
    const r = await doImport(parseImport($('#imp').value), t);
    if (r) { renderTab(); showImpResult(r); toast('Import selesai.', 'ok'); }
  }
  else if (a === 'add-one') {
    const row = { nis: $('#ns-nis').value.trim(), nama: $('#ns-nama').value.trim(), kelas: $('#ns-kelas').value.trim(), username: $('#ns-user').value.trim() };
    if (!row.nis || !row.nama || !row.kelas) { toast('NIS, nama, dan kelas wajib diisi.', 'bad'); return; }
    const r = await doImport([row], t);
    if (r) { renderTab(); showImpResult(r); toast('Siswa disimpan.', 'ok'); }
  }
  else if (a === 'reset-pw') {
    const u = t.dataset.u;
    if (!await confirmBox({ title: 'Reset password?', msg: 'Password <b>' + esc(u) + '</b> akan dikembalikan ke <b>siswa2026</b>.', ok: 'Ya, reset' })) return;
    const r = await api('apiAdminResetPassword', null, u);
    if (sessionLost(r)) return;
    toast(r.ok ? 'Password direset ke siswa2026.' : (r.msg || 'Gagal reset.'), r.ok ? 'ok' : 'bad');
  }
  else if (a === 'del-stu') {
    const u = t.dataset.u, s = S.admin.students.find(x => x.username === u);
    if (!await confirmBox({ title: 'Hapus siswa?', msg: 'Siswa <b>' + esc(s ? s.nama : u) + '</b> beserta isian formulirnya akan dihapus permanen.', ok: 'Ya, hapus siswa', danger: true })) return;
    const r = await api('apiAdminDeleteStudent', null, u);
    if (sessionLost(r)) return;
    if (!r.ok) { toast(r.msg || 'Gagal menghapus.', 'bad'); return; }
    await adminReload(); renderTab(); toast('Siswa dihapus.', 'ok');
  }
}

// ================= PENGATUR AKSI & BOOT =================
function onAction(a, t) {
  if (a === 'nav' && S.role !== 'admin') {
    if (t.dataset.v === 'form') openForm();
    else renderStudentHome();
    return;
  }
  switch (a) {
    case 'open-form': openForm(); break;
    case 'back': case 'home': renderStudentHome(); break;
    case 'diskusi': setDiskusi(t.dataset.v); break;
    case 'rencana':
      F.rencana = t.dataset.v; popOpen = false; popDismissed = false; renderDyn();
      setTimeout(() => { const el = $('#sec-isian'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
      break;
    case 'chip': toggleMapel(t.dataset.m, F.mapel.indexOf(t.dataset.m) < 0); break;
    case 'chip-all': {
      const s = topSug()[+t.dataset.i];
      if (s) { s.g.mapel.forEach(m => { if (F.mapel.indexOf(m) < 0) F.mapel.push(m); }); renderMapel(); renderPaket(); renderPop(); toast('Mapel saran dicentang. Anda masih bisa mengubahnya.', 'ok'); }
      break;
    }
    case 'pop-x': popDismissed = true; renderPop(); break;
    case 'review': reviewForm(); break;
    default:
      if (S.role === 'admin') adminAction(a, t);
  }
}

setupPWA();
renderLogin();
